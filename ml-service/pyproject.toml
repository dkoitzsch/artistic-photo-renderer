[project]
name = "blur-layer-ml-service"
version = "0.1.0"
description = "Lokaler ML-Dienst für Blur & Layer Studio (Masken, später Tiefe und Inpainting)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.1",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "pillow==12.3.0",
  "numpy==2.5.4",
  "torch==2.14.1",
  "torchvision",
  "transformers==5.19.0",
  "huggingface-hub==2.2.0",
  "timm==1.0.30",
  "kornia==0.8.3",
  "einops==0.8.2",
  "scipy==1.18.1",
]

[project.scripts]
ml-service = "ml_service.main:run"

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
